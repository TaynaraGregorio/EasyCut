<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EasyCut - Tela Inicial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='imagens/favicon001.png') }}" type="image/png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-layout {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .auth-brand {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(160deg, rgba(59, 130, 246, 0.12) 0%, rgba(16, 185, 129, 0.08) 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-image:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .brand-logo {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .brand-tagline {
            color: #94a3b8;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.5;
            margin: 0;
            max-width: 280px;
        }

        .auth-panel {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #e2e8f0;
            margin: 0 0 8px 0;
            text-align: center;
        }

        .panel-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            margin: 0 0 28px 0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 0;
            margin: 12px 0;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-loja {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-loja:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-cliente {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-cliente:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .login-link {
            margin-top: 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .login-link:hover {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.2);
        }

        @media (min-width: 1200px) {
            .auth-layout {
                max-width: 1000px;
            }

            .auth-brand,
            .auth-panel {
                padding: 56px 48px;
            }

            .brand-image {
                max-width: 340px;
            }

            .brand-logo {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
                align-items: flex-start;
            }

            .auth-layout {
                grid-template-columns: 1fr;
                max-width: 520px;
            }

            .auth-brand {
                padding: 32px 28px 24px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .auth-panel {
                padding: 28px 28px 32px;
            }

            .brand-image {
                max-width: 220px;
                margin-bottom: 18px;
            }

            .brand-logo {
                font-size: 2rem;
            }

            .brand-tagline {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .auth-brand {
                padding: 24px 20px 20px;
            }

            .auth-panel {
                padding: 24px 20px 28px;
            }

            .brand-image {
                max-width: 180px;
            }

            .brand-logo {
                font-size: 1.75rem;
            }

            .btn {
                font-size: 1rem;
                padding: 14px 0;
            }

            .panel-title {
                font-size: 1.2rem;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 8px;
            }

            .auth-layout {
                max-height: calc(100vh - 16px);
                overflow-y: auto;
            }

            .auth-brand {
                padding: 16px 20px;
            }

            .auth-panel {
                padding: 16px 20px;
            }

            .brand-image {
                max-width: 120px;
                margin-bottom: 8px;
            }

            .brand-logo {
                font-size: 1.4rem;
                margin-bottom: 4px;
            }

            .brand-tagline {
                display: none;
            }

            .btn {
                padding: 10px 0;
                margin: 6px 0;
            }
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <aside class="auth-brand">
            <img src="{{ url_for('static', filename='imagens/imgTelaInicial.jpg') }}" alt="EasyCut Barbearia" class="brand-image">
            <div class="brand-logo">EasyCut</div>
            <p class="brand-tagline">Agende cortes, gerencie sua barbearia e encontre os melhores profissionais perto de você.</p>
        </aside>
        <main class="auth-panel">
            <h2 class="panel-title">Bem-vindo</h2>
            <p class="panel-subtitle">Escolha como deseja começar</p>
            <button class="btn btn-loja" onclick="window.location.href='{{ url_for('cadastro_barbearia_page') }}'">Cadastrar como Barbearia</button>
            <button class="btn btn-cliente" onclick="window.location.href='{{ url_for('cadastro_cliente_page') }}'">Cadastrar como Cliente</button>
            <a href="{{ url_for('login_page') }}" class="login-link">Já possui cadastro? Faça login</a>
        </main>
    </div>
</body>
</html>
